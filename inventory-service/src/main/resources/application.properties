spring.application.name=inventory-service
server.port=8282
management.endpoints.web.exposure.include=*

# Replaces bootstrap.properties - see the note in catalog-service.
spring.config.import=optional:configserver:http://localhost:8888,optional:vault://

spring.cloud.vault.host=localhost
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
spring.cloud.vault.authentication=token
spring.cloud.vault.token=934f9eae-31ff-a8ef-e1ca-4bea9e07aa09

spring.rabbitmq.addresses=localhost:5672

# Boot 2.5 changed the ordering so data.sql runs before Hibernate creates the schema,
# which makes this file's opening DELETE fail against a table that does not exist yet.
# Deferring puts it back after ddl-auto has run.
spring.jpa.defer-datasource-initialization=true
