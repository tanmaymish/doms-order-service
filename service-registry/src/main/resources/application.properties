spring.application.name=service-registry
server.port=8761

# spring-cloud-starter-config is on the classpath, and since Spring Cloud 2020 a config
# client with no spring.config.import fails at startup rather than silently skipping the
# config server. "optional:" lets the registry start before the config server does.
spring.config.import=optional:configserver:http://localhost:8888
eureka.instance.hostname=localhost

# These were written as eureka.instance.client.*, which binds to nothing: the registry
# was silently trying to register with and fetch from itself. The properties are
# eureka.client.*.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.prefer-ip-address=true
