spring.application.name=catalog-service
server.port=8181
management.endpoints.web.exposure.include=*

# Replaces bootstrap.properties. Spring Cloud 2020 removed the bootstrap context, so
# config-server and Vault are ordinary config sources reached through spring.config.import.
# "optional:" keeps the service startable when neither is running, which is what lets the
# tests boot the context offline.
spring.config.import=optional:configserver:http://localhost:8888,optional:vault://

# Vault dev mode. This is the fixed development token vault-init.sh sets for local runs.
# It is not a credential for anything real, and nothing outside a laptop should ever read
# a token out of a file in a repository.
spring.cloud.vault.host=localhost
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
spring.cloud.vault.authentication=token
spring.cloud.vault.token=934f9eae-31ff-a8ef-e1ca-4bea9e07aa09

# Boot 2.5 changed the ordering so data.sql runs before Hibernate creates the schema,
# which makes this file's opening DELETE fail against a table that does not exist yet.
# Deferring puts it back after ddl-auto has run.
spring.jpa.defer-datasource-initialization=true
