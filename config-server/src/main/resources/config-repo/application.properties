# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Tracing. Sleuth and spring-cloud-starter-zipkin were removed in Spring Cloud 2022;
# Micrometer Tracing with the Brave bridge is the supported replacement, and its
# properties live under management.* rather than spring.sleuth.* / spring.zipkin.*.
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
#spring.rabbitmq.username=guest
#spring.rabbitmq.password=guest
