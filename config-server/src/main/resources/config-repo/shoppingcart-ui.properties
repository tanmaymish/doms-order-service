# Routing moved into shoppingcart-ui's own application.yml when Zuul was replaced by
# Spring Cloud Gateway: zuul.prefix and zuul.sensitiveHeaders have no equivalent here,
# because the routes now name their own paths and headers explicitly.
#
# The commented-out OAuth2 client properties that used to live here belonged to Spring
# Security OAuth2, which was removed in Spring Security 6. oauth2-server now runs Spring
# Authorization Server, and a client would be configured under
# spring.security.oauth2.client.registration.* instead.
