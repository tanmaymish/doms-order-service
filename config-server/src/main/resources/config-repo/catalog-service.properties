logging.level.com.doms=debug

# com.mysql.jdbc.Driver was deprecated years ago and the artifact moved to
# com.mysql:mysql-connector-j.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/catalog?useSSL=false
#spring.datasource.username=root
#spring.datasource.password=admin

# spring.datasource.initialization-mode was renamed in Boot 2.5.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Replaces the hystrix.command.* thresholds. The instance name matches the
# @CircuitBreaker(name = "inventory-service") in InventoryServiceClient.
resilience4j.circuitbreaker.instances.inventory-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.inventory-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventory-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventory-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventory-service.register-health-indicator=true

# Expose breaker state and events so the operations console can show them.
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
