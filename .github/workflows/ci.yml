name: DOMS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shoppingcart-ui/frontend/package-lock.json

      - name: Install dependencies
        working-directory: shoppingcart-ui/frontend
        run: npm ci

      - name: Lint
        working-directory: shoppingcart-ui/frontend
        run: npm run lint

      - name: Type-check & build
        working-directory: shoppingcart-ui/frontend
        run: npm run build

  build:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # The five migrated modules: Spring Boot 3.5, Spring Cloud 2025.0, Java 21.
    - name: Build & test with Maven
      run: >
        ./mvnw clean package
        -pl config-server,service-registry,catalog-service,inventory-service,order-service

    - name: Coverage summary
      if: always()
      run: |
        echo "## Test coverage (instructions covered)" >> "$GITHUB_STEP_SUMMARY"
        echo "| Module | Coverage |" >> "$GITHUB_STEP_SUMMARY"
        echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
        for csv in order-service catalog-service inventory-service; do
          file="$csv/target/site/jacoco/jacoco.csv"
          if [ -f "$file" ]; then
            pct=$(awk -F',' 'NR>1 {missed+=$4; covered+=$5} END {if (missed+covered>0) printf "%.1f%%", (covered/(missed+covered))*100; else print "n/a"}' "$file")
            echo "| $csv | $pct |" >> "$GITHUB_STEP_SUMMARY"
          fi
        done

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-reports
        path: |
          order-service/target/site/jacoco/
          catalog-service/target/site/jacoco/
          inventory-service/target/site/jacoco/
        retention-days: 14

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Images (Compose)
      run: docker compose build

    - name: Finalize Build
      run: echo "Build, test, and Docker image creation successful!"

  legacy:
    name: Build & Test (JDK 8, pending migration)
    runs-on: ubuntu-latest

    # oauth2-server, hystrix-dashboard, zipkin-server and shoppingcart-ui are still on
    # Spring Boot 2.0 and cannot run on a modern JVM: Spring 5.0's CGLIB reflects into
    # java.lang, which JDK 17 forbids, and Spring Security 5.0 needs the JAXB classes the
    # JDK dropped in 11. They are built on JDK 8 rather than propped up with --add-opens
    # and JAXB shims, because each needs a real migration and the README says which:
    # Zuul 1 to Spring Cloud Gateway, Spring Security OAuth2 to Spring Authorization
    # Server, and the Hystrix dashboard and Zipkin server modules retired outright.
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    # shoppingcart-ui's frontend-maven-plugin builds the React console as part of this run.
    - name: Build & test with Maven
      run: >
        ./mvnw clean package
        -pl oauth2-server,hystrix-dashboard,zipkin-server,shoppingcart-ui

