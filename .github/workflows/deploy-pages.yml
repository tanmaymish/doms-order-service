name: Deploy Console to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "shoppingcart-ui/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Official Pages deployment: no gh-pages branch, and configure-pages
# self-enables Pages on first run so no manual Settings step is needed.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shoppingcart-ui/frontend/package-lock.json

      - name: Install dependencies
        working-directory: shoppingcart-ui/frontend
        run: npm ci

      - name: Build (demo mode)
        working-directory: shoppingcart-ui/frontend
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"
          # Pages serves under /<repo>/ (trailing slash required by Vite).
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
          # The build normally writes into shoppingcart-ui's Spring Boot
          # classpath; the demo publish uses its own output dir so it
          # never touches that location.
          VITE_OUT_DIR: "dist-demo"

      - name: SPA 404 fallback
        working-directory: shoppingcart-ui/frontend
        run: cp dist-demo/index.html dist-demo/404.html

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shoppingcart-ui/frontend/dist-demo

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
